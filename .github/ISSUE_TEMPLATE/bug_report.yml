name: 🐛 Bug Report
description: Report a reproducible bug or installation issue with PTSolns IDE
title: "[Bug]: "
labels: ["bug"]

body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug.
        Please fill out all required fields. Detailed answers help us fix issues faster.

  - type: input
    attributes:
      label: Your name
      placeholder: e.g. John Smith
    validations:
      required: true

  - type: dropdown
    attributes:
      label: Operating system
      options:
        - "Windows 11"
        - "Windows 10"
        - "macOS"
        - "Linux"
        - "Other"
    validations:
      required: true

  - type: input
    attributes:
      label: Age of the computer
      placeholder: e.g. New, 2 years, 5+ years
    validations:
      required: true

  - type: input
    attributes:
      label: Version of PTSolns IDE tested
      placeholder: e.g. v0.0.44
    validations:
      required: true

  - type: dropdown
    attributes:
      label: Have you ever installed Arduino IDE on this computer?
      options:
        - "Yes"
        - "No"
        - "Not sure"
    validations:
      required: true

  - type: input
    attributes:
      label: Total time for initial installation
      description: Write "Fail" if installation did not succeed
      placeholder: e.g. 30 seconds, 2 minutes, Fail
    validations:
      required: true

  - type: input
    attributes:
      label: Total time for first launch
      description: Write "Fail" if the software did not launch
      placeholder: e.g. 10 seconds, 1 minute, Fail
    validations:
      required: true

  - type: dropdown
    attributes:
      label: Did you see a Windows "Unknown publisher" warning?
      options:
        - "Yes"
        - "No"
        - "Not applicable"
    validations:
      required: true

  - type: dropdown
    attributes:
      label: Did you see SmartScreen (Windows) or Gatekeeper (macOS)?
      options:
        - "Yes"
        - "No"
        - "Not applicable"
    validations:
      required: true

  - type: textarea
    attributes:
      label: What happened?
      description: Describe the issue or error you experienced.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Download installer
        2. Run installer
        3. Click ...
        4. Error occurs
    validations:
      required: true

  - type: textarea
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    attributes:
      label: Logs, screenshots, or additional notes
      description: Drag and drop files here if available (optional)
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug.
        You do not need to assign anyone — we handle that internally.
