name: 🐛 Bug Report
description: Report a bug or installation/security warning with PTSolns IDE
title: "[Bug]: "
labels: ["bug"]
assignees:
  - Kia7596
  - PTSolns

body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug.
        If we need more info, we will contact you through your GitHub account.

  - type: dropdown
    attributes:
      label: May PTSolns staff contact you about this bug if more information is needed?
      description: We will contact you through GitHub (comments or @mentions).
      options:
        - "Yes"
        - "No"
    validations:
      required: true

  - type: dropdown
    attributes:
      label: Operating system
      options:
        - "Windows 11"
        - "Windows 10"
        - "macOS"
        - "Linux"
        - "Other"
    validations:
      required: true

  - type: input
    attributes:
      label: Version of PTSolns IDE tested
      placeholder: e.g. v0.0.44
    validations:
      required: true

  - type: dropdown
    attributes:
      label: Did you see a Windows "Unknown publisher" warning?
      options:
        - "Yes"
        - "No"
        - "Not applicable"
    validations:
      required: true

  - type: dropdown
    attributes:
      label: Did you see SmartScreen (Windows) or Gatekeeper (macOS)?
      options:
        - "Yes"
        - "No"
        - "Not applicable"
    validations:
      required: true

  - type: textarea
    attributes:
      label: What happened?
      description: Describe the issue or error you experienced.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Steps to reproduce (optional)
      description: If you can reproduce it, list steps here. If not, leave blank.
      placeholder: |
        1. Download installer
        2. Run installer
        3. Click ...
        4. Error occurs
    validations:
      required: false

  - type: textarea
    attributes:
      label: Expected behavior (optional)
      description: What did you expect to happen instead?
    validations:
      required: false

  - type: textarea
    attributes:
      label: Logs, screenshots, or additional notes (optional)
      description: Drag and drop files here if available.
    validations:
      required: false
